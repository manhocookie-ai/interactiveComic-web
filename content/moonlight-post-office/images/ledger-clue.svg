<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <image href="post-office.png" width="1024" height="768" preserveAspectRatio="xMidYMid slice"/>
  <rect x="58" y="55" width="650" height="196" rx="22" fill="#171425" fill-opacity=".9" stroke="#e9c87b" stroke-width="3"/>
  <text x="92" y="103" fill="#fff8e8" font-family="sans-serif" font-size="25">
    <tspan x="92" dy="0">장부에는 한 달마다 직원 한 명의 이름이 지워져 있었다.</tspan>
    <tspan x="92" dy="42">마지막 줄에는 아직 오지 않은 날짜가 적혀 있었다.</tspan>
    <tspan x="92" dy="48" fill="#ffdba0">내일 새벽 0시 00분 · 보관 물품: 모아</tspan>
    <tspan x="92" dy="40">그때, 불 꺼진 창고에서 첫 번째 종이 울렸다.</tspan>
  </text>
</svg>
