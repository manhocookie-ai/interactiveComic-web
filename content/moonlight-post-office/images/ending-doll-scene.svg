<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <image href="ending-doll.png" width="1024" height="768" preserveAspectRatio="xMidYMid slice"/>
  <rect x="48" y="40" width="560" height="212" rx="22" fill="#311b20" fill-opacity=".88" stroke="#e9c87b" stroke-width="3"/>
  <text x="82" y="86" fill="#fff8e8" font-family="sans-serif" font-size="25">
    <tspan x="82" dy="0" fill="#e9c87b" font-size="32">엔딩 · 새 직원</tspan>
    <tspan x="82" dy="48">“고마워. 이제 내가 나갈 차례야.”</tspan>
    <tspan x="82" dy="42">다음 날, 우체국은 아무 일도 없었다는 듯 문을 열었다.</tspan>
    <tspan x="82" dy="42" fill="#e9c87b">진열장 속 토끼 인형만 조용히 입을 움직였다. “나는 여기 있어.”</tspan>
  </text>
</svg>
