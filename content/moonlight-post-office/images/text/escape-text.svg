<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect x="180" y="50" width="650" height="210" rx="24" fill="#101522" fill-opacity=".88" stroke="#b8c8ff" stroke-width="3"/>
  <text x="220" y="104" fill="#f7f5ff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="30">
    <tspan x="220" dy="0">문틈으로 새벽빛이 쏟아졌다.</tspan>
    <tspan x="220" dy="52">모아가 달리자 뒤에서 작은 울음이 들렸다.</tspan>
    <tspan x="220" dy="54" fill="#b8c8ff">“모아야… 나도 데려가 줘.”</tspan>
    <tspan x="220" dy="48">딸랑. 마지막 종이 울렸다.</tspan>
  </text>
</svg>
