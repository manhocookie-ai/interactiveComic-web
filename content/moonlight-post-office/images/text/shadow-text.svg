<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect x="180" y="50" width="700" height="222" rx="24" fill="#111321" fill-opacity=".88" stroke="#b8c8ff" stroke-width="3"/>
  <text x="220" y="104" fill="#f7f5ff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="30">
    <tspan x="220" dy="0">모아가 멈춰도 그림자는 다가왔다.</tspan>
    <tspan x="220" dy="52">어둠 속에서 모아와 똑같은 목소리가 속삭였다.</tspan>
    <tspan x="220" dy="54" fill="#b8c8ff">“모아야, 열쇠는 가짜야. 이쪽으로 와.”</tspan>
    <tspan x="220" dy="50">두 번째 종이 울렸다.</tspan>
  </text>
</svg>
