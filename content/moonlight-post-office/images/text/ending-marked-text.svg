<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect x="180" y="44" width="980" height="350" rx="24" fill="#2b171d" fill-opacity=".9" stroke="#e9c87b" stroke-width="3"/>
  <text x="220" y="100" fill="#fff8e8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="30">
    <tspan x="220" dy="0" fill="#e9c87b" font-size="38">새 직원</tspan>
    <tspan x="220" dy="58">그 목소리에 대답한 순간,</tspan>
    <tspan x="220" dy="46">그림자는 이미 모아의 발끝을 붙잡았다.</tspan>
    <tspan x="220" dy="46">새벽빛 앞에서 모아의 몸이 멈췄다.</tspan>
    <tspan x="220" dy="46">“고마워. 이제 내가 나갈 차례야.”</tspan>
    <tspan x="220" dy="46" fill="#e9c87b">다음 날, 진열장 속 토끼 인형이 모아의 목소리로 말했다.</tspan>
  </text>
</svg>
