<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect x="740" y="48" width="652" height="248" rx="24" fill="#111827" fill-opacity=".9" stroke="#a9bed8" stroke-width="3"/>
  <text x="780" y="100" fill="#f7f5ff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="29">
    <tspan x="780" dy="0">선반의 인형들은 사라진 직원들을 닮아 있었다.</tspan>
    <tspan x="780" dy="52" fill="#d7c19a">여우 인형이 조용히 입을 열었다.</tspan>
    <tspan x="780" dy="48">“여긴 편지를 보관하는 곳이 아니야.”</tspan>
    <tspan x="780" dy="48">“도착하지 못한 사람을 보관하는 곳이지.”</tspan>
  </text>
</svg>
