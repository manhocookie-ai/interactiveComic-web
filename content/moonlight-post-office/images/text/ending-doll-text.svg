<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect x="180" y="52" width="680" height="244" rx="24" fill="#2b171d" fill-opacity=".88" stroke="#e9c87b" stroke-width="3"/>
  <text x="220" y="108" fill="#fff8e8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="30">
    <tspan x="220" dy="0" fill="#e9c87b" font-size="38">새 직원</tspan>
    <tspan x="220" dy="58">“고마워. 이제 내가 나갈 차례야.”</tspan>
    <tspan x="220" dy="50">다음 날, 우체국은 아무 일도 없었다는 듯 열렸다.</tspan>
    <tspan x="220" dy="50" fill="#e9c87b">진열장 속 토끼 인형만 입을 움직였다.</tspan>
  </text>
</svg>
