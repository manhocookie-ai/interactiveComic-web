<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect x="180" y="58" width="760" height="286" rx="24" fill="#171425" fill-opacity=".88" stroke="#e9c87b" stroke-width="3"/>
  <text x="220" y="112" fill="#fff8e8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="29">
    <tspan x="220" dy="0" fill="#e9c87b">발신인: 내일 아침의 모아</tspan>
    <tspan x="220" dy="54">“종이 세 번 울리기 전에 우체국을 떠나.”</tspan>
    <tspan x="220" dy="48">“누가 네 목소리로 불러도 대답하지 마.”</tspan>
    <tspan x="220" dy="48">“마지막 종이 울리면 절대 뒤돌아보지 마.”</tspan>
    <tspan x="220" dy="52" fill="#ffdba0">불 꺼진 창고에서 첫 번째 종이 울렸다.</tspan>
  </text>
</svg>
