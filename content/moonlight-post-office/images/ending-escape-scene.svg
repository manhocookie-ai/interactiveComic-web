<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <image href="ending-escape.png" width="1024" height="768" preserveAspectRatio="xMidYMid slice"/>
  <rect x="50" y="42" width="590" height="204" rx="22" fill="#182039" fill-opacity=".88" stroke="#ffe0a0" stroke-width="3"/>
  <text x="84" y="88" fill="#fff8e8" font-family="sans-serif" font-size="25">
    <tspan x="84" dy="0" fill="#ffe0a0" font-size="32">엔딩 · 배달 완료</tspan>
    <tspan x="84" dy="48">아침 햇살 아래 우체국은 오래된 폐허로 변했다.</tspan>
    <tspan x="84" dy="42">편지에는 처음 없었던 마지막 문장이 나타났다.</tspan>
    <tspan x="84" dy="42" fill="#ffe0a0">“잘했어. 이제 어제의 너에게 이 편지를 보내.”</tspan>
  </text>
</svg>
