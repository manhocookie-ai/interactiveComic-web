<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <image href="archive.png" width="1024" height="768" preserveAspectRatio="xMidYMid slice"/>
  <rect x="46" y="38" width="670" height="214" rx="22" fill="#171425" fill-opacity=".9" stroke="#e9c87b" stroke-width="3"/>
  <text x="80" y="84" fill="#fff8e8" font-family="sans-serif" font-size="24">
    <tspan x="80" dy="0">보관실의 인형들은 모두 사라진 직원들의 이름표를 달고 있었다.</tspan>
    <tspan x="80" dy="42" fill="#ffdba0">여우 인형: “이곳은 편지를 보관하는 곳이 아니야.”</tspan>
    <tspan x="80" dy="38" fill="#ffdba0">“도착하지 못한 사람을 보관하는 곳이지.”</tspan>
    <tspan x="80" dy="44">천장 위에서 세 번째 종을 당기는 줄이 팽팽해졌다.</tspan>
  </text>
</svg>
