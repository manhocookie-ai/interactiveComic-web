<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <rect width="1000" height="1200" fill="#f2e9dc"/>
  <rect x="70" y="70" width="860" height="1060" rx="42" fill="#fffaf3" stroke="#d7b98c" stroke-width="8"/>
