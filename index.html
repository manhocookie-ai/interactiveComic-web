<body>
    <div id="app">
        <main class="viewer-state" aria-live="polite">
            <div class="loading-mark" aria-hidden="true"></div>
            <h1>뷰어를 준비하는 중입니다</h1>
        </main>
    </div>

    <div id="blazor-error-ui">
        앱을 계속 실행할 수 없습니다.
        <a href="." class="reload">새로고침</a>
        <button type="button" class="dismiss" aria-label="오류 닫기">닫기</button>
    </div>
    <script>
        window.interactiveComics = {
            getImageSize: function (url) {
                return new Promise(function (resolve, reject) {
                    const image = new Image();
                    image.onload = function () {
                        resolve({ width: image.naturalWidth, height: image.naturalHeight });
                    };
                    image.onerror = function () {
                        reject(new Error("이미지를 불러오지 못했습니다: " + url));
                    };
                    image.src = url;
                });
            },
            playSound: function (url) {
                const audio = new Audio(url);
                return audio.play();
            },
            getScrollOffset: function () {
                return window.scrollY;
            },
            restoreScrollOffset: function (offset) {
                window.scrollTo({ top: offset, left: 0, behavior: "instant" });
            },
            registerLifecycle: function (receiver) {
                this.unregisterLifecycle();
                this.cancelInFlight = false;
                const save = function () {
                    receiver.invokeMethodAsync("SaveBeforeSuspendAsync");
                };
                const visibility = function () {
                    if (document.visibilityState === "hidden") {
                        save();
                    }
                };
                const popState = function () {
                    if (window.interactiveComics.suppressNextPop) {
                        window.interactiveComics.suppressNextPop = false;
                        return;
                    }
                    if (!window.interactiveComics.viewerNavigationActive) {
                        return;
                    }
                    history.pushState({ interactiveComicsViewer: true }, "");
                    if (window.interactiveComics.cancelInFlight) {
                        return;
                    }
                    window.interactiveComics.cancelInFlight = true;
                    receiver.invokeMethodAsync("HandleCancelAsync")
                        .finally(function () {
                            window.interactiveComics.cancelInFlight = false;
                        });
                };
                const keyDown = function (event) {
                    if (event.key === "Escape" &&
                        window.interactiveComics.viewerNavigationActive) {
                        event.preventDefault();
                        receiver.invokeMethodAsync("HandleCancelAsync");
                    }
                };
                window.addEventListener("pagehide", save);
                window.addEventListener("popstate", popState);
                window.addEventListener("keydown", keyDown);
                document.addEventListener("visibilitychange", visibility);
                this.lifecycle = {
                    save: save,
                    visibility: visibility,
                    popState: popState,
                    keyDown: keyDown
                };
            },
            unregisterLifecycle: function () {
                if (!this.lifecycle) {
                    return;
                }
                window.removeEventListener("pagehide", this.lifecycle.save);
                window.removeEventListener("popstate", this.lifecycle.popState);
                window.removeEventListener("keydown", this.lifecycle.keyDown);
                document.removeEventListener("visibilitychange", this.lifecycle.visibility);
                this.lifecycle = null;
                this.cancelInFlight = false;
            },
            setViewerNavigationActive: function (active) {
                if (active && !this.viewerNavigationActive) {
                    history.pushState({ interactiveComicsViewer: true }, "");
                    this.viewerNavigationActive = true;
                    return;
                }
                if (!active && this.viewerNavigationActive) {
                    this.viewerNavigationActive = false;
                    this.suppressNextPop = true;
                    history.back();
                }
            },
            progress: {
                open: function () {
                    return new Promise(function (resolve, reject) {
                        const request = indexedDB.open("interactive-comics", 1);
                        request.onupgradeneeded = function () {
                            const database = request.result;
                            if (!database.objectStoreNames.contains("progress")) {
                                database.createObjectStore("progress", { keyPath: "key" });
                            }
                        };
                        request.onsuccess = function () {
                            resolve(request.result);
                        };
                        request.onerror = function () {
                            reject(request.error);
                        };
                    });
                },
                save: async function (key, snapshot) {
                    const database = await window.interactiveComics.progress.open();
                    return new Promise(function (resolve, reject) {
                        const transaction = database.transaction("progress", "readwrite");
                        transaction.objectStore("progress").put({ key: key, snapshot: snapshot });
                        transaction.oncomplete = function () {
                            database.close();
                            resolve();
                        };
                        transaction.onerror = function () {
                            database.close();
                            reject(transaction.error);
                        };
                        transaction.onabort = transaction.onerror;
                    });
                },
                load: async function (key) {
                    const database = await window.interactiveComics.progress.open();
                    return new Promise(function (resolve, reject) {
                        const transaction = database.transaction("progress", "readonly");
                        const request = transaction.objectStore("progress").get(key);
                        request.onsuccess = function () {
                            resolve(request.result ? request.result.snapshot : null);
                        };
                        request.onerror = function () {
                            reject(request.error);
                        };
                        transaction.oncomplete = function () {
                            database.close();
                        };
                    });
                },
                remove: async function (key) {
                    const database = await window.interactiveComics.progress.open();
                    return new Promise(function (resolve, reject) {
                        const transaction = database.transaction("progress", "readwrite");
                        transaction.objectStore("progress").delete(key);
                        transaction.oncomplete = function () {
                            database.close();
                            resolve();
                        };
                        transaction.onerror = function () {
                            database.close();
                            reject(transaction.error);
                        };
                        transaction.onabort = transaction.onerror;
                    });
                }
            }
        };
    </script>

</body>

</html>
