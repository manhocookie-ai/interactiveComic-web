<body>
    <div id="app">
        <main class="viewer-state" aria-live="polite">
            <div class="loading-mark" aria-hidden="true"></div>
            <h1>뷰어를 준비하는 중입니다</h1>
        </main>
    </div>

    <div id="blazor-error-ui">
        앱을 계속 실행할 수 없습니다.
        <a href="." class="reload">새로고침</a>
        <button type="button" class="dismiss" aria-label="오류 닫기">닫기</button>
    </div>
    <script>
        window.interactiveComics = {
            getImageSize: function (url) {
                return new Promise(function (resolve, reject) {
                    const image = new Image();
                    image.onload = function () {
                        resolve({ width: image.naturalWidth, height: image.naturalHeight });
                    };
                    image.onerror = function () {
                        reject(new Error("이미지를 불러오지 못했습니다: " + url));
                    };
                    image.src = url;
                });
            },
            playSound: function (url) {
                const audio = new Audio(url);
                return audio.play();
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
